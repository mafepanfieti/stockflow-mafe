<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>StockFlow MaFe</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f2f2f;
  color: white;
}

#login {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container { padding: 20px; }

.login-box {
  background: white;
  color: black;
  padding: 40px;
  border-radius: 15px;
  width: 320px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}

button {
  background: #1e7f5c;
  color: white;
  border: 2px solid #145c43;
  cursor: pointer;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

.cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
}

.card {
  background: white;
  color: black;
  padding: 30px;
  width: 200px;
  text-align: center;
  border-radius: 10px;
  cursor: pointer;
}

table {
  width: 100%;
  background: white;
  color: black;
  margin-top: 20px;
}

th, td {
  padding: 10px;
  text-align: center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h2>StockFlow MaFe</h2>

    <label>Usuário:</label>
    <input id="user" placeholder="Digite seu usuário">

    <label>Senha:</label>
    <input id="pass" type="password" placeholder="Digite sua senha">

    <button onclick="entrar()">Entrar</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;" class="container">

  <h1 style="text-align:center;">StockFlow MaFe</h1>

  <div class="cards">
    <div class="card" id="btnProduto" onclick="mostrarTela('cadastro')">Produto</div>
    <div class="card" onclick="mostrarTela('entrada')">Entrada</div>
    <div class="card" onclick="mostrarTela('saida')">Saída</div>
    <div class="card" id="btnUsuario" onclick="mostrarTela('usuarios')">Usuários</div>
    <div class="card" id="btnHistorico" onclick="mostrarTela('historico')">Histórico</div>
  </div>

  <h2>Estoque</h2>

  <label>Buscar produto:</label>
  <input id="buscaProduto" placeholder="Digite nome ou código">

  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Marca</th>
        <th>Quantidade</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaHome"></tbody>
  </table>

</div>

<!-- CADASTRO -->
<div id="cadastro" class="container" style="display:none;">
  <h2>Cadastrar Produto</h2>

  <label>Descrição:</label>
  <input id="desc" placeholder=>

  <label>Marca:</label>
  <input id="marca" placeholder=>

  <label>Código:</label>
  <input id="codigo" placeholder=>

  <button onclick="cadastrar()">Cadastrar</button>
  <button onclick="voltar()">Voltar</button>
</div>

<!-- ENTRADA -->
<div id="entrada" class="container" style="display:none;">
  <h2>Entrada</h2>

  <label>Produto:</label>
  <input id="codEntrada" placeholder="Código ou nome">

  <label>Quantidade:</label>
  <input id="qtdEntrada" type="number">

  <button onclick="entradaProduto()">Registrar</button>
  <button onclick="voltar()">Voltar</button>
</div>

<!-- SAÍDA -->
<div id="saida" class="container" style="display:none;">
  <h2>Saída</h2>

  <label>Produto:</label>
  <input id="codSaida" placeholder="Código ou nome">

  <label>Quantidade:</label>
  <input id="qtdSaida" type="number">

  <button onclick="saidaProduto()">Registrar</button>
  <button onclick="voltar()">Voltar</button>
</div>

<!-- USUÁRIOS -->
<div id="usuarios" class="container" style="display:none;">
  <h2>Gerenciar Usuários</h2>

  <label>Nome do Usuário:</label>
  <input id="novoUser" placeholder="Ex: joao">

  <label>Senha:</label>
  <input id="novaSenha" type="password" placeholder="Digite a senha">

  <button onclick="cadastrarUsuario()">Cadastrar</button>

  <ul id="listaUsuarios"></ul>

  <button onclick="voltar()">Voltar</button>
</div>

<!-- HISTÓRICO -->
<div id="historico" class="container" style="display:none;">
  <h2>Histórico de Ações</h2>

  <label>Data e hora inicial:</label>
  <input type="datetime-local" id="dataInicio">

  <label>Data e hora final:</label>
  <input type="datetime-local" id="dataFim">

  <button onclick="filtrarLogs()">Filtrar</button>

  <div id="listaLogs"></div>

  <button onclick="voltar()">Voltar</button>
</div>

<script>
// DADOS
let produtos = JSON.parse(localStorage.getItem("produtos")) || [];
let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
let logs = JSON.parse(localStorage.getItem("logs")) || [];

// GARANTE ADMIN
if(!usuarios.some(u => u.user === "admin")){
  usuarios.push({ user:"admin", pass:"@dmin130806", tipo:"admin"});
  localStorage.setItem("usuarios", JSON.stringify(usuarios));
}

let usuarioLogado;

// LOGIN
function entrar(){
  let u=user.value.toLowerCase();
  let p=pass.value;

  let usuario=usuarios.find(x=>x.user.toLowerCase()===u && x.pass===p);

  if(usuario){
    usuarioLogado=usuario;
    login.style.display="none";
    dashboard.style.display="block";

    if(usuario.tipo!=="admin"){
      btnProduto.style.display="none";
      btnUsuario.style.display="none";
      btnHistorico.style.display="none";
    }

    registrarLog("Login");
    atualizarEstoqueHome();
  } else alert("Login inválido");
}

// NAVEGAÇÃO
function mostrarTela(t){
  document.querySelectorAll(".container").forEach(e=>e.style.display="none");
  document.getElementById(t).style.display="block";

  if(t==="usuarios") atualizarUsuarios();
  if(t==="historico") mostrarLogs();
}

function voltar(){
  document.querySelectorAll(".container").forEach(e=>e.style.display="none");
  dashboard.style.display="block";
  atualizarEstoqueHome();
}

// PRODUTO
function cadastrar(){
  if(usuarioLogado.tipo!=="admin") return;
  if(!confirm("Cadastrar produto?")) return;

let descricao = document.getElementById("desc").value;
let marca = document.getElementById("marca").value;
let codigo = document.getElementById("codigo").value;

fetch("https://stockflow-mafe-1.onrender.com/produto", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    desc: descricao,
    marca: marca,
    codigo: codigo
  })
})
.then(res => res.text())
.then(data => {
  alert(data);
  atualizarEstoqueHome();
});
}

// BUSCA
function buscar(v){
  return produtos.find(p=>p.codigo===v || (p.descricao||"").includes(v));
}

// ENTRADA
function entradaProduto(){
  if(!confirm("Confirmar entrada?")) return;

  let p=buscar(codEntrada.value);
  let q=parseInt(qtdEntrada.value);

  if(p){
    p.entradas.push({qtd:q});
    registrarLog("Entrada");
    salvar();
    atualizarEstoqueHome();
  }
}

// SAÍDA
function saidaProduto(){
  if(!confirm("Confirmar saída?")) return;

  let p=buscar(codSaida.value);
  let q=parseInt(qtdSaida.value);

  if(p){
    p.saidas.push({qtd:q});
    registrarLog("Saída");
    salvar();
    atualizarEstoqueHome();
  }
}

// USUÁRIOS
function cadastrarUsuario(){
  if(usuarioLogado.tipo!=="admin") return;

  usuarios.push({
    user:novoUser.value,
    pass:novaSenha.value,
    tipo:"usuario"
  });

  localStorage.setItem("usuarios",JSON.stringify(usuarios));
  atualizarUsuarios();
}

function atualizarUsuarios(){
  listaUsuarios.innerHTML="";
  usuarios.forEach(u=>{
    listaUsuarios.innerHTML+=`
    <li>${u.user} (${u.tipo})
    ${u.tipo!=="admin" ? `<button onclick="excluirUsuario('${u.user}')">Excluir</button>` : "🔒"}
    </li>`;
  });
}

function excluirUsuario(nome){
  if(confirm("Excluir usuário?")){
    usuarios=usuarios.filter(u=>u.user!==nome);
    localStorage.setItem("usuarios",JSON.stringify(usuarios));
    atualizarUsuarios();
  }
}

// LOGS
function registrarLog(acao){
  let agora=new Date();
  logs.push({
    usuario:usuarioLogado.user,
    acao,
    data:agora.toLocaleDateString(),
    hora:agora.toLocaleTimeString()
  });
  localStorage.setItem("logs",JSON.stringify(logs));
}

function mostrarLogs(){
  listaLogs.innerHTML="";
  logs.forEach(l=>{
    listaLogs.innerHTML+=`
    <div style="background:white;color:black;margin:5px;padding:10px;">
    👤 ${l.usuario}<br>
    📌 ${l.acao}<br>
    📅 ${l.data} ⏰ ${l.hora}
    </div>`;
  });
}

function filtrarLogs(){
  let inicio = document.getElementById("dataInicio").value;
  let fim = document.getElementById("dataFim").value;

  listaLogs.innerHTML = "";

  logs.forEach(l => {

    let dataLog = new Date(
      l.data.split("/").reverse().join("-") + "T" + l.hora
    );

    let dentro = true;

    if(inicio){
      dentro = dataLog >= new Date(inicio);
    }

    if(fim){
      dentro = dentro && dataLog <= new Date(fim);
    }

    if(dentro){
      listaLogs.innerHTML += `
        <div style="background:white;color:black;margin:5px;padding:10px;">
        👤 ${l.usuario}<br>
        📌 ${l.acao}<br>
        📅 ${l.data} ⏰ ${l.hora}
        </div>`;
    }

  });
}

// SALVAR
function salvar(){
  localStorage.setItem("produtos",JSON.stringify(produtos));
}

// DELETE
function excluirProduto(id){
  if(!confirm("Deseja excluir este produto?")) return;

  fetch(`https://stockflow-mafe-1.onrender.com/produto/${id}`, {
    method: "DELETE"
  })
  .then(res => res.text())
  .then(data => {
    alert(data);
    atualizarEstoqueHome();
  })
  .catch(err => {
    console.error(err);
    alert("Erro ao excluir");
  });
}

// ESTOQUE
function atualizarEstoqueHome(){
  let tabelaHome = document.getElementById("tabelaHome");
  let buscaInput = document.getElementById("buscaProduto");

  let busca = (buscaInput.value || "").toLowerCase();

  tabelaHome.innerHTML = "";

  fetch("https://stockflow-mafe-1.onrender.com/produtos")
    .then(res => {
      if(!res.ok) throw new Error("Erro no servidor");
      return res.json();
    })
    .then(produtosAPI => {

      let produtosLocal = produtos || [];

      produtos = produtosAPI.map(p => {
        let local = produtosLocal.find(lp => lp.codigo === p.codigo) || {};

        return {
          ...p,
          entradas: local.entradas || [],
          saidas: local.saidas || []
        };
      });

      produtos.forEach(p => {

        let codigo = (p.codigo || "").toLowerCase();
        let descricao = (p.descricao || "").toLowerCase();

        if (
          codigo.includes(busca) ||
          descricao.includes(busca)
        ) {

          let quantidade =
            (p.entradas?.reduce((t,e)=>t+e.qtd,0) || 0) -
            (p.saidas?.reduce((t,s)=>t+s.qtd,0) || 0);

          tabelaHome.innerHTML += `
            <tr>
              <td>${p.codigo}</td>
              <td>${p.descricao || "Sem descrição"}</td>
              <td>${p.marca}</td>
              <td>${quantidade}</td>
              ${
                usuarioLogado.tipo === "admin"
                ? `<td><button onclick="excluirProduto(${p.id})">Excluir</button></td>`
                : ""
              }
            </tr>
          `;
        }

      });

    })
    .catch(() => {
      // 👇 tenta de novo se o Render estiver dormindo
      setTimeout(() => atualizarEstoqueHome(), 2000);
    });
}

document.addEventListener("input",e=>{
  if(e.target.id==="buscaProduto") atualizarEstoqueHome();
});
</script>

</body>
</html>
