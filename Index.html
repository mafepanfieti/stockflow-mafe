<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>StockFlow MaFe</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f2f2f;
  color: #fff;
}

h1, h2 {
  text-align: center;
}

.container {
  padding: 20px;
}

#login {
  display: flex;
  height: 100vh;
  justify-content: center;
  align-items: center;
}

.login-box {
  background: white;
  color: black;
  padding: 30px;
  border-radius: 12px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
}

button {
  background: #1e7f5c;
  color: white;
  border: 2px solid #145c43;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #145c43;
  transform: scale(1.05);
}

.card {
  width: 200px;
  padding: 30px;
  background: white;
  color: black;
  border-radius: 15px;
  text-align: center;
  border: 2px solid #1e7f5c;
  cursor: pointer;
}

.cards {
  display: flex;
  gap: 20px;
  justify-content: center;
}

.big-card {
  margin: 30px auto;
  width: 60%;
  padding: 30px;
  background: white;
  color: black;
  border-radius: 15px;
  text-align: center;
}

table {
  width: 100%;
  background: white;
  color: black;
}

th, td {
  padding: 10px;
  text-align: center;
}
</style>
</head>

<body>

<div id="login">
  <div class="login-box">
    <h2>StockFlow MaFe</h2>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button onclick="entrar()">Entrar</button>
  </div>
</div>

<div id="dashboard" class="container" style="display:none;">
  <h1>StockFlow MaFe</h1>

  <div class="cards">
    <div class="card" onclick="mostrarTela('cadastro')">Cadastrar Produto</div>
    <div class="card" onclick="mostrarTela('entrada')">Entrada</div>
    <div class="card" onclick="mostrarTela('saida')">Saída</div>
    <div class="card" id="btnUsuario" onclick="mostrarTela('cadUsuario')">Cadastrar Usuário</div>
  </div>

  <div class="big-card" onclick="mostrarTela('estoque')">
    <h2>Estoque</h2>
  </div>
</div>

<div id="cadastro" class="container" style="display:none;">
  <h2>Cadastrar Produto</h2>
  <input id="desc" placeholder="Descrição">
  <input id="marca" placeholder="Marca">
  <input id="codigo" placeholder="Código">
  <button onclick="cadastrar()">Cadastrar</button>
  <button onclick="voltar()">Voltar</button>
</div>

<div id="entrada" class="container" style="display:none;">
  <h2>Entrada</h2>
  <input id="codEntrada">
  <input id="qtdEntrada" type="number">
  <button onclick="entradaProduto()">Registrar</button>
  <button onclick="voltar()">Voltar</button>
</div>

<div id="saida" class="container" style="display:none;">
  <h2>Saída</h2>
  <input id="codSaida">
  <input id="qtdSaida" type="number">
  <button onclick="saidaProduto()">Registrar</button>
  <button onclick="voltar()">Voltar</button>
</div>

<div id="cadUsuario" class="container" style="display:none;">
  <h2>Cadastrar Usuário</h2>
  <input id="novoUser">
  <input id="novaSenha" type="password">
  <button onclick="cadastrarUsuario()">Cadastrar</button>
  <button onclick="voltar()">Voltar</button>
</div>

<div id="estoque" class="container" style="display:none;">
  <h2>Estoque</h2>
  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Marca</th>
        <th>Estoque</th>
        <th id="colAcoes">Ações</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>
  <button onclick="voltar()">Voltar</button>
</div>

<script>
let produtos = JSON.parse(localStorage.getItem("produtos")) || [];

let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [
  { user: "admin", pass: "@dmin130806", tipo: "admin" }
];

let usuarioLogado = null;

function entrar(){
  let u = user.value.toLowerCase().trim();
  let p = pass.value.trim();

  let usuario = usuarios.find(x =>
    x.user.toLowerCase() === u && x.pass === p
  );

  if(usuario){
    usuarioLogado = usuario;

    login.style.display = "none";
    dashboard.style.display = "block";

    if(usuario.tipo !== "admin"){
      btnUsuario.style.display = "none";
      colAcoes.style.display = "none";
    }

  } else {
    alert("Login inválido");
  }
}

function mostrarTela(tela){
  document.querySelectorAll(".container").forEach(e => e.style.display="none");
  document.getElementById(tela).style.display = "block";
  if(tela === "estoque") atualizarTabela();
}

function voltar(){
  document.querySelectorAll(".container").forEach(e => e.style.display="none");
  dashboard.style.display = "block";
}

function cadastrar(){
  if(!desc.value || !codigo.value){
    alert("Preencha os campos!");
    return;
  }

  if(produtos.find(p => p.codigo === codigo.value)){
    alert("Produto já existe!");
    return;
  }

  produtos.push({
    desc: desc.value,
    marca: marca.value,
    codigo: codigo.value,
    entradas: [],
    saidas: []
  });

  salvar();
  desc.value = marca.value = codigo.value = "";
  alert("Produto cadastrado!");
}

function buscarProduto(v){
  return produtos.find(p =>
    p.codigo === v ||
    p.desc.toLowerCase().includes(v.toLowerCase())
  );
}

function entradaProduto(){
  let qtd = parseInt(qtdEntrada.value);
  let prod = buscarProduto(codEntrada.value);

  if(!prod || isNaN(qtd) || qtd <= 0){
    alert("Erro");
    return;
  }

  prod.entradas.push({qtd});
  salvar();
  alert("Entrada registrada!");
}

function saidaProduto(){
  let qtd = parseInt(qtdSaida.value);
  let prod = buscarProduto(codSaida.value);

  if(!prod || isNaN(qtd) || qtd <= 0){
    alert("Erro");
    return;
  }

  let e = prod.entradas.reduce((s,x)=>s+x.qtd,0);
  let s = prod.saidas.reduce((s,x)=>s+x.qtd,0);

  if(qtd > (e - s)){
    alert("Estoque insuficiente!");
    return;
  }

  prod.saidas.push({qtd});
  salvar();
  alert("Saída registrada!");
}

function excluirProduto(cod){
  if(usuarioLogado.tipo !== "admin") return;

  if(confirm("Excluir produto?")){
    produtos = produtos.filter(p => p.codigo !== cod);
    salvar();
    atualizarTabela();
  }
}

function cadastrarUsuario(){
  if(usuarioLogado.tipo !== "admin") return;

  if(!novoUser.value || !novaSenha.value){
    alert("Preencha os campos!");
    return;
  }

  if(usuarios.find(u => u.user === novoUser.value)){
    alert("Usuário já existe!");
    return;
  }

  usuarios.push({
    user: novoUser.value,
    pass: novaSenha.value,
    tipo: "usuario"
  });

  localStorage.setItem("usuarios", JSON.stringify(usuarios));
  alert("Usuário cadastrado!");
}

function salvar(){
  localStorage.setItem("produtos", JSON.stringify(produtos));
}

function atualizarTabela(){
  tabela.innerHTML = "";

  produtos.forEach(p => {
    let estoque = p.entradas.reduce((s,e)=>s+e.qtd,0) -
                   p.saidas.reduce((s,e)=>s+e.qtd,0);

    tabela.innerHTML += `
      <tr>
        <td>${p.codigo}</td>
        <td>${p.desc}</td>
        <td>${p.marca}</td>
        <td>${estoque}</td>
        <td>
          ${usuarioLogado.tipo === "admin"
            ? `<button onclick="excluirProduto('${p.codigo}')" style="background:#b22222">Excluir</button>`
            : ''}
        </td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
